<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>share</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family:'Bricolage Grotesque', system-ui, sans-serif;
    color:#f4f1ea;
    background:#101010;
  }
  #bg {
    position:fixed; inset:0;
    background:#101010 center / cover no-repeat;
  }
  #bg::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,.2) 55%, rgba(0,0,0,.45));
  }

  /* fullscreen "click anywhere" screen */
  #gate {
    position:fixed; inset:0; z-index:10;
    display:none; align-items:center; justify-content:center; text-align:center;
    background:rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    cursor:pointer; padding:24px;
    -webkit-tap-highlight-color:transparent;
  }
  #gate.on { display:flex; animation:in .35s ease; }
  #gate p {
    font-weight:800; text-transform:lowercase;
    font-size:clamp(34px, 8vw, 80px);
    letter-spacing:-.035em; line-height:.95;
  }
  @keyframes in { from{opacity:0} to{opacity:1} }

  .wm {
    position:fixed; right:16px; bottom:max(14px, env(safe-area-inset-bottom));
    z-index:20; font-size:12px; color:rgba(244,241,234,.7);
    pointer-events:none;
  }
  .wm b { font-weight:800; color:#f4f1ea; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="gate"><p>click anywhere<br>to share</p></div>
<div class="wm">Made by <b>@m9_</b> on Yapin'</div>

<script>
// ============ EDIT THIS ============
const SHARE = {
  title: "join LUCK on yapin'",
  text:  "join this cool server on yapin!!🍀",                          // optional message
  url:   "https://yapin.gg/invite/GwVwU3JL77"        // what gets shared
};
const BACKGROUND = "bg.jpg";          // your image file next to this html, or a full image url
// ===================================

document.getElementById('bg').style.backgroundImage = `url("${BACKGROUND}")`;

const data = {};
if (SHARE.title) data.title = SHARE.title;
if (SHARE.text)  data.text  = SHARE.text;
if (SHARE.url)   data.url   = SHARE.url;

const gate = document.getElementById('gate');
const canNative = typeof navigator.share === 'function' &&
  (!navigator.canShare || navigator.canShare(data));

async function doShare() {
  if (!canNative) {
    // browsers with no share sheet: copy the link instead
    try { await navigator.clipboard.writeText(SHARE.url || SHARE.text); } catch (e) {}
    return 'copied';
  }
  try { await navigator.share(data); return 'shared'; }
  catch (e) { return e && e.name === 'AbortError' ? 'cancelled' : 'needs-click'; }
}

// tap anywhere = opens the share sheet inside a real user gesture
gate.addEventListener('click', async () => {
  gate.classList.remove('on');
  await doShare();
});

// try to open instantly; if the device wants a tap first, show the gate
(async () => {
  if (!canNative) { gate.classList.add('on'); return; }
  if (await doShare() === 'needs-click') gate.classList.add('on');
})();
</script>
</body>
</html>
